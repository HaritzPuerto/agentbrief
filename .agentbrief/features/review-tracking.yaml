id: review-tracking
title: Approve features and notice when they change
status: done
summary: >
  The reviewer can approve a feature or request changes. Approving requires
  ticking every code block as checked and answering the feature's questions.
  Requesting changes needs a note, and copies a ready-to-paste request for the agent. If the agent later
  edits the code or tests behind an approved feature, the approval is marked
  "changed since review" so it gets checked again.
details: >
  Edits elsewhere in the same file don't invalidate the review; only the
  referenced functions do. The server also refuses an approval if the code
  changed while the page was open.
code:
  - path: src/agentbrief/core.py
    symbol: fingerprint
  - path: src/agentbrief/core.py
    symbol: feature_view
    note: compares the stored fingerprint with the current one
  - path: src/agentbrief/core.py
    symbol: save_review
  - path: src/agentbrief/core.py
    symbol: approval_gate
    note: approve only after every code block is checked and every question answered; returns the score
  - path: src/agentbrief/static/index.html
    lines: "253-273"
    note: browser side of the gate; progress is kept per code version
  - path: src/agentbrief/static/index.html
    lines: "531-542"
    note: the text copied for the agent when you request changes
