questions:
  - question: You approved a feature, then the agent edits a different function in the same file. Is the approval still valid?
    answer: Yes. Only the referenced functions and tests are fingerprinted, not whole files.
    about: src/agentbrief/core.py::fingerprint
  - question: What do you need to do before the Approve button becomes clickable?
    answer: Tick every code block as checked and answer (reveal and self-grade) every question.
    about: src/agentbrief/core.py::approval_gate
  - question: Is "Request changes" also blocked until you finish the questions?
    answer: No, only approving is gated, since you may spot a problem early.
    about: src/agentbrief/server.py::make_handler
  - question: You press "Request changes". How does the agent find out?
    answer: It doesn't on its own. The request (your note, the code and tests involved, how to finish) is copied to your clipboard for you to paste into the agent. The copy button stays until the agent changes the code.
