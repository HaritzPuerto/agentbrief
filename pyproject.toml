[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentbrief"
version = "0.1.0"
description = "Your coding agent briefs you on what it built: features in plain language, the code behind them, the tests that prove them, and questions to check you understood."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
agentbrief = "agentbrief.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbrief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
